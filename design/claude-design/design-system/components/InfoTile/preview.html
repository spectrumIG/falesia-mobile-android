<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>InfoTile — preview</title></head>
<body>
<div class="fm-demo">
<div class="fm-tiles fm-tiles-3">
<div class="fm-tile"><span class="fm-icon" aria-hidden="true">timer</span><p class="fm-tile-label">Approach</p><p class="fm-tile-value">20 min</p></div>
<div class="fm-tile"><span class="fm-icon" aria-hidden="true">wb_sunny</span><p class="fm-tile-label">Sun</p><p class="fm-tile-value">Morning</p></div>
<div class="fm-tile"><span class="fm-icon" aria-hidden="true">altitude</span><p class="fm-tile-label">Routes</p><p class="fm-tile-value">42</p></div>
</div>
<div class="fm-tiles fm-tiles-2">
<div class="fm-tile fm-tile-start"><p class="fm-tile-label">Grade</p><p class="fm-tile-value">V8 (7B)</p></div>
<div class="fm-tile fm-tile-start"><p class="fm-tile-label">Height</p><p class="fm-tile-value">15ft (4.5m)</p></div>
</div>
<div class="fm-tiles fm-tiles-3">
<div class="fm-tile fm-tile-stat"><p class="fm-tile-label">Sends</p><p class="fm-tile-value">128</p></div>
<div class="fm-tile fm-tile-stat fm-tile-highlight"><p class="fm-tile-label">Hardest</p><p class="fm-tile-value">7c+</p></div>
<div class="fm-tile fm-tile-stat"><p class="fm-tile-label">Days</p><p class="fm-tile-value">42</p></div>
</div>
</div>
</body>
</html>
