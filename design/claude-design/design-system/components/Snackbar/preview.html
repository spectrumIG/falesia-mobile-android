<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Snackbar — preview</title></head>
<body>
<div class="fm-demo">
<div class="fm-snackbar fm-snackbar-error" role="status"><span class="fm-icon" aria-hidden="true">sync_problem</span><span class="fm-snackbar-text">Couldn't refresh. Showing saved data.</span><button class="fm-snackbar-action">Retry</button></div>
<div class="fm-snackbar fm-snackbar-info" role="status"><span class="fm-icon" aria-hidden="true">wifi_off</span><span class="fm-snackbar-text">You're offline. Showing saved data.</span></div>
<div class="fm-snackbar fm-snackbar-success" role="status"><span class="fm-icon fm-icon-fill" aria-hidden="true">check_circle</span><span class="fm-snackbar-text">Data is already up to date.</span></div>
</div>
</body>
</html>
