<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CragCard — preview</title></head>
<body>
<div class="fm-demo">
<article class="fm-crag-card">
<div class="fm-crag-card-media" style="display:flex;align-items:center;justify-content:center;color:var(--primary)"><span class="fm-icon fm-icon-30" aria-hidden="true">landscape</span></div>
<div class="fm-crag-card-body">
<div class="fm-crag-card-top"><div><h3 class="card-title">Siurana</h3><p class="fm-location"><span class="fm-icon" aria-hidden="true">location_on</span> Catalonia, Spain</p></div><span class="fm-tag">Sport</span></div>
<div class="fm-crag-card-stats">
<div class="fm-stat"><span class="fm-stat-label">Routes</span><span class="fm-stat-value">1,240</span></div>
<div class="fm-stat"><span class="fm-stat-label">Best Grade</span><span class="fm-stat-value">7a - 9b</span></div>
<button class="fm-icon-btn fm-icon-btn-primary fm-push" aria-label="Open Siurana"><span class="fm-icon" aria-hidden="true">chevron_right</span></button>
</div>
</div>
</article>
</div>
</body>
</html>
