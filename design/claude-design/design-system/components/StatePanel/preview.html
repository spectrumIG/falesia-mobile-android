<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatePanel — preview</title></head>
<body>
<div class="fm-state fm-state-error">
<div class="fm-state-icon"><span class="fm-icon" aria-hidden="true">wifi_off</span></div>
<h2 class="fm-state-title">No connection</h2>
<p class="fm-state-text">Crag data is downloaded once, on the first launch. Connect to the internet and try again.</p>
<div class="fm-state-actions"><button class="fm-btn fm-btn-primary"><span class="fm-icon" aria-hidden="true">refresh</span>Try again</button><button class="fm-link" style="justify-content:center">Open network settings</button></div>
</div>
</body>
</html>
