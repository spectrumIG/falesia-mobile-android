<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Banner — preview</title></head>
<body>
<div class="fm-demo">
<div class="fm-banner" role="status"><span class="fm-icon" aria-hidden="true">cloud_off</span><div class="fm-banner-body"><p class="fm-banner-title">You're offline</p><p class="fm-banner-text">Showing data saved 3 days ago.</p></div></div>
<div class="fm-banner fm-banner-warning" role="status"><span class="fm-icon" aria-hidden="true">history</span><div class="fm-banner-body"><p class="fm-banner-title">Data is more than a week old</p><p class="fm-banner-text">Pull down to refresh when you're online.</p></div></div>
<div class="fm-banner fm-banner-error" role="alert"><span class="fm-icon" aria-hidden="true">error</span><div class="fm-banner-body"><p class="fm-banner-title">Last update failed</p><p class="fm-banner-text">We'll try again automatically.</p></div><button class="fm-link">Retry</button></div>
</div>
</body>
</html>
