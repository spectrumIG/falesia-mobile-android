# detekt overrides. The build uses `buildUponDefaultConfig = true`: every rule and value not listed here
# comes from detekt's default config (detekt 1.23.8). Keep this file to the project's deliberate choices.

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  ComplexCondition:
    threshold: 7
  CyclomaticComplexMethod:
    threshold: 35
    ignoreAnnotated: [ 'Composable' ]
  LongMethod:
    threshold: 200
    ignoreAnnotated: [ 'Composable' ]
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 20
    ignoreAnnotated: [ 'Composable' ]
    ignoreAnnotatedParameter: [ 'Composable' ]
  TooManyFunctions:
    thresholdInFiles: 31
    thresholdInClasses: 31
    thresholdInInterfaces: 20
    thresholdInObjects: 15
    thresholdInEnums: 20
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreAnnotatedFunctions: [ 'Composable' ]

coroutines:
  GlobalCoroutineUsage:
    active: true

exceptions:
  # Errors are caught on purpose at layer boundaries and turned into Either.Left (Either.catch).
  TooGenericExceptionCaught:
    active: false

naming:
  FunctionMaxLength:
    # Backticked test names describe behavior and are long by design.
    maximumFunctionNameLength: 170
  FunctionNaming:
    # Composables are PascalCase.
    ignoreAnnotated: [ 'Composable', 'OptIn' ]
  FunctionParameterNaming:
    ignoreAnnotated: [ 'Composable', 'OptIn' ]
  MatchingDeclarationName:
    ignoreAnnotated: [ 'Composable' ]
  ObjectPropertyNaming:
    constantPattern: '[A-Z][A-Z(\_\)?a-z0-9]*'
  VariableNaming:
    privateVariablePattern: '(_)?[a-zA-Z][A-Za-z(_)?0-9]*'

style:
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 5
  ForbiddenComment:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 290
    excludeCommentStatements: true
    ignoreAnnotated: [ 'Preview' ]
  NewLineAtEndOfFile:
    active: false
  ReturnCount:
    max: 5
  UnusedPrivateMember:
    allowedNames: '(_|ignored|expected|serialVersionUID)'
    # Previews are private and only used by the IDE.
    ignoreAnnotated: [ 'Preview', 'Composable' ]
